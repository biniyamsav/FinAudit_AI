[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FinAudit_AI"
version = "0.1.0"
description = "Financial Knowledge Graph & Compliance Audit Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0,<2.1",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.18",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "xlrd>=2.0.1",
    "python-multipart>=0.0.9",
    "rapidocr-onnxruntime>=1.4.4",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "pypdfium2>=4.0.0",
    "weaviate-client>=4.9.0,<4.10.0",  # pinned to the version verified against the local 1.25.0 server (4.24.0 refuses servers <1.27)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.2.0",
    "xlwt>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"