services:
  - type: web
    name: finaudit-ai
    env: python
    region: oregon # or ohio, frankfurt, singapore
    plan: free # or starter/pro depending on needs
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GROQ_API_KEY
        sync: false # Set this securely in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: finaudit-db
          property: connectionString

databases:
  - name: finaudit-db
    plan: free
    databaseName: finauditedb
    user: finaudit_user