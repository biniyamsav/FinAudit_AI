services:
  - type: web
    name: finaudit-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: finaudit-db
          property: connectionString

databases:
  - name: finaudit-db
    plan: free
    databaseName: finauditdb
    user: finaudit_user