services:
  - type: web
    name: finaudit-ai
    runtime: docker
    region: virginia
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER_MODE
        value: external
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: WEAVIATE_URL
        sync: false
      - key: WEAVIATE_API_KEY
        sync: false